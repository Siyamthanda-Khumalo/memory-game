<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memory Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent zoom on double tap */
        * {
            touch-action: manipulation;
        }
        .card-button {
            width: 100%;
            aspect-ratio: 1;
            min-height: 0;
            font-size: clamp(0.875rem, 2vw, 1.25rem);
        }
        
        /* Enhanced card animations for mobile */
        .card-button {
            transition: all 0.2s ease;
            transform: scale(1);
            -webkit-tap-highlight-color: transparent;
        }
        
        .card-button:active {
            transform: scale(0.95);
        }
        
        /* Prevent text selection on game elements */
        .game-area {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Improved button touch targets */
        .control-btn {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Enhanced two-column layout */
        .game-grid {
            width: 100%;
            max-height: 70vh;
        }
        
        /* Mobile: Stack columns vertically */
        @media (max-width: 1023px) {
            .game-grid {
                max-height: 50vh;
            }
        }
        
        /* Ensure proper spacing in two-column layout */
        @media (min-width: 1024px) {
            .game-grid {
                max-height: 80vh;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-2 sm:p-4 min-h-screen">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-screen">
            <!-- Left Column: Stats & Controls -->
            <div class="lg:col-span-1 space-y-4">
                <!-- Stats Row -->
                <div class="bg-white rounded-lg p-4 border shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-800 mb-3">Game Stats</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Moves</span>
                            <span id="moves-count" class="font-semibold text-slate-900 text-lg">0</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Pairs Found</span>
                            <span class="font-semibold text-lg">
                                <span id="matched-pairs" class="text-emerald-600">0</span>/                            <span id="target-pairs" class="text-slate-900">10</span>
                            </span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Time</span>
                            <span id="elapsed-time" class="font-semibold text-slate-900 text-lg">00:00.0</span>
                        </div>
                        <div class="pt-2 border-t border-slate-200">
                            <div class="text-xs text-slate-500" id="game-status">(Tap Start to begin)</div>
                        </div>
                    </div>
                </div>

                <!-- Controls Row -->
                <div class="bg-white rounded-lg p-4 border shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-800 mb-3">Game Controls</h2>
                    <div class="space-y-4">
                        <!-- Difficulty Selector -->
                        <div>
                            <label for="difficulty-select" class="block text-sm font-medium text-slate-700 mb-2">Difficulty Level</label>
                            <select id="difficulty-select" class="w-full control-btn px-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="easy">Easy (4×3 grid)</option>
                                <option value="medium" selected>Medium (4×5 grid)</option>
                                <option value="hard">Hard (24 cards)</option>
                            </select>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="grid grid-cols-1 gap-2">
                            <button id="start-btn" class="control-btn px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium">
                                Start Game
                            </button>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="pause-resume-btn" class="control-btn px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed font-medium text-sm" disabled>
                                    Pause
                                </button>
                                <button id="stop-btn" class="control-btn px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed font-medium text-sm" disabled>
                                    Stop
                                </button>
                            </div>
                            <button id="reset-btn" class="control-btn px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded-lg hover:bg-gray-50 font-medium text-sm">
                                New Game
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Best Scores -->
                <div class="bg-white rounded-lg p-4 border shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-semibold text-slate-800">Best Scores</h2>
                        <button id="reset-scores-btn" class="control-btn px-3 py-1 text-xs text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded border border-gray-200">
                            Reset
                        </button>
                    </div>
                    <div class="text-sm text-slate-700 mb-2">
                        <span id="difficulty-label">Medium</span> Difficulty
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Best moves</span>
                            <span id="best-moves" class="font-medium text-slate-900">—</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Best time</span>
                            <span id="best-time" class="font-medium text-slate-900">—</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Game Card -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg border shadow-sm game-area h-full flex flex-col">
                    <div class="p-4 flex-1 flex flex-col">
                        <h2 class="text-xl font-semibold text-slate-800 mb-4 text-center">Memory Game</h2>
                        
                        <!-- Game Grid -->
                        <div class="flex-1 flex items-center justify-center mb-4">
                            <div id="game-grid" class="game-grid grid gap-2" style="grid-template-columns: repeat(4, 1fr);">
                                <!-- Cards will be inserted here -->
                            </div>
                        </div>

                        <!-- Status Messages -->
                        <div id="status-message" class="text-center text-slate-600 text-sm p-4 bg-slate-50 rounded-lg hidden">
                            Ready when you are — tap Start to begin.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game constants
        const PREVIEW_MS = 3000;
        const MIN_CARD_PX = 50;
        
        const EMOJIS_ALL = [
            "🎁", "🚗", "🐶", "🌟", "🎵", "⚽", "🎲", "🧩", "🍩", "🚀", "🎧", "🌈",
            "🔔", "🦊", "🐢", "📷", "🎯", "🪐",
        ];

        const DIFFICULTY_CONFIG = {
            easy: { pairs: 6, label: "Easy", columns: 4, rows: 3 },
            medium: { pairs: 10, label: "Medium", columns: 4, rows: 5 },
            hard: { pairs: 12, label: "Hard" }, // Will use dynamic calculation
        };

        const LS_KEY = "memoryScores_v1";

        // Game state
        let gameState = "idle"; // idle, preview, running, paused, finished
        let difficulty = "medium";
        let deck = [];
        let selectedIds = [];
        let moves = 0;
        let matchedPairs = 0;
        let elapsedMs = 0;
        let cooldown = false;
        let revealAll = false;
        let hasScored = false;
        let scores = {};

        // Timers
        let tickInterval = null;
        let startTime = null;
        let previewTimeout = null;

        // DOM elements
        const movesCount = document.getElementById('moves-count');
        const matchedPairsEl = document.getElementById('matched-pairs');
        const targetPairsEl = document.getElementById('target-pairs');
        const elapsedTimeEl = document.getElementById('elapsed-time');
        const gameStatusEl = document.getElementById('game-status');
        const difficultySelect = document.getElementById('difficulty-select');
        const difficultyLabel = document.getElementById('difficulty-label');
        const bestMovesEl = document.getElementById('best-moves');
        const bestTimeEl = document.getElementById('best-time');
        const gameGrid = document.getElementById('game-grid');
        const statusMessage = document.getElementById('status-message');
        
        const startBtn = document.getElementById('start-btn');
        const pauseResumeBtn = document.getElementById('pause-resume-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resetBtn = document.getElementById('reset-btn');
        const resetScoresBtn = document.getElementById('reset-scores-btn');

        // Utility functions
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function computeOptimalGrid(cardCount) {
            const config = DIFFICULTY_CONFIG[difficulty];
            
            // Use fixed layout for easy and medium modes with smaller cards
            if (config.columns && config.rows) {
                const screenWidth = window.innerWidth;
                const isDesktop = screenWidth >= 1024;
                
                // Calculate available space
                let availableWidth;
                if (isDesktop) {
                    const containerPadding = 32;
                    const totalWidth = Math.min(screenWidth - containerPadding, 1280);
                    availableWidth = (totalWidth * 2 / 3) - 32;
                } else {
                    const containerPadding = 16;
                    availableWidth = screenWidth - (containerPadding * 2);
                }
                
                // Calculate smaller card size similar to hard mode
                const gapSize = isDesktop ? 8 : 6;
                const totalGapWidth = (config.columns - 1) * gapSize;
                const maxCardWidth = (availableWidth - totalGapWidth) / config.columns;
                
                // Limit card size to make them smaller (similar to hard mode)
                const cardSize = Math.min(maxCardWidth, isDesktop ? 100 : 60);
                
                return {
                    columns: config.columns,
                    rows: config.rows,
                    cardSize: cardSize,
                    totalSlots: config.columns * config.rows
                };
            }
            
            // Dynamic calculation for hard mode (unchanged)
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const isDesktop = screenWidth >= 1024;
            
            let availableWidth, availableHeight;
            
            if (isDesktop) {
                const containerPadding = 32;
                const totalWidth = Math.min(screenWidth - containerPadding, 1280);
                availableWidth = (totalWidth * 2 / 3) - 32;
                availableHeight = screenHeight * 0.8;
            } else {
                const containerPadding = 16;
                availableWidth = screenWidth - (containerPadding * 2);
                availableHeight = screenHeight * 0.5;
            }
            
            let bestConfig = { columns: 4, rows: Math.ceil(cardCount / 4) };
            let bestScore = 0;
            
            for (let cols = 2; cols <= Math.min(6, cardCount); cols++) {
                const rows = Math.ceil(cardCount / cols);
                
                const gapSize = isDesktop ? 8 : 6;
                const totalGapWidth = (cols - 1) * gapSize;
                const totalGapHeight = (rows - 1) * gapSize;
                
                const cardWidth = (availableWidth - totalGapWidth) / cols;
                const cardHeight = (availableHeight - totalGapHeight) / rows;
                const cardSize = Math.min(cardWidth, cardHeight);
                
                if (cardSize > 40) {
                    const aspectRatio = Math.min(cardWidth / cardHeight, cardHeight / cardWidth);
                    const score = cardSize * aspectRatio * (1 / rows);
                    
                    if (score > bestScore) {
                        bestScore = score;
                        bestConfig = { columns: cols, rows, cardSize };
                    }
                }
            }
            
            return bestConfig;
        }

        function buildDeck(pairs, totalSlots = null) {
            const chosen = EMOJIS_ALL.slice(0, pairs);
            const pairsArr = chosen.flatMap((e, i) => [
                { id: i * 2, emoji: e, matched: false },
                { id: i * 2 + 1, emoji: e, matched: false },
            ]);
            
            // If we have a fixed grid size, add empty slots if needed
            if (totalSlots && pairsArr.length < totalSlots) {
                const emptySlots = totalSlots - pairsArr.length;
                for (let i = 0; i < emptySlots; i++) {
                    pairsArr.push({ id: `empty-${i}`, emoji: '', matched: false, isEmpty: true });
                }
            }
            
            return shuffle(pairsArr);
        }

        function formatMs(ms) {
            const s = Math.floor(ms / 1000);
            const m = Math.floor(s / 60);
            const rem = s % 60;
            const tenths = Math.floor((ms % 1000) / 100);
            return `${String(m).padStart(2, "0")}:${String(rem).padStart(2, "0")}.${tenths}`;
        }

        function loadScores() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch {
                return {};
            }
        }

        function saveScores(scoresObj) {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(scoresObj));
            } catch {}
        }

        // Timer functions
        function stopTimer() {
            if (tickInterval) {
                clearInterval(tickInterval);
                tickInterval = null;
            }
        }

        function startTimer() {
            startTime = Date.now() - elapsedMs;
            stopTimer();
            tickInterval = setInterval(() => {
                if (startTime != null) {
                    elapsedMs = Date.now() - startTime;
                    updateDisplay();
                }
            }, 100);
        }

        // Game functions
        function resetRoundToIdle(keepOrder = true) {
            stopTimer();
            if (previewTimeout) {
                clearTimeout(previewTimeout);
                previewTimeout = null;
            }
            
            gameState = "idle";
            elapsedMs = 0;
            selectedIds = [];
            moves = 0;
            matchedPairs = 0;
            cooldown = false;
            hasScored = false;
            revealAll = false;
            
            if (!keepOrder) {
                const config = DIFFICULTY_CONFIG[difficulty];
                const totalSlots = config.columns && config.rows ? config.columns * config.rows : null;
                deck = buildDeck(config.pairs, totalSlots);
            } else {
                deck = deck.map(c => ({ ...c, matched: false }));
            }
            
            updateDisplay();
            renderGrid();
        }

        function handleCardClick(cardId) {
            if (gameState !== "running") return;
            if (revealAll || cooldown) return;
            if (selectedIds.includes(cardId)) return;
            
            const card = deck.find(c => c.id === cardId);
            if (!card || card.matched || card.isEmpty) return; // Don't allow clicks on empty slots
            if (selectedIds.length >= 2) return;
            
            selectedIds.push(cardId);
            renderGrid();
            
            if (selectedIds.length === 2) {
                const [aId, bId] = selectedIds;
                const a = deck.find(c => c.id === aId);
                const b = deck.find(c => c.id === bId);
                
                moves++;
                updateDisplay();
                
                if (a.emoji === b.emoji) {
                    // Match found - provide haptic feedback on mobile
                    if ('vibrate' in navigator) {
                        navigator.vibrate(100);
                    }
                    
                    deck.forEach(c => {
                        if (c.id === aId || c.id === bId) {
                            c.matched = true;
                        }
                    });
                    matchedPairs++;
                    selectedIds = [];
                    updateDisplay();
                    renderGrid();
                    
                    // Check if game is finished
                    if (matchedPairs === DIFFICULTY_CONFIG[difficulty].pairs) {
                        finishGame();
                    }
                } else {
                    // No match - provide different haptic feedback
                    if ('vibrate' in navigator) {
                        navigator.vibrate([50, 50, 50]);
                    }
                    
                    cooldown = true;
                    setTimeout(() => {
                        selectedIds = [];
                        cooldown = false;
                        renderGrid();
                    }, 800);
                }
            }
        }

        function finishGame() {
            stopTimer();
            gameState = "finished";
            
            // Success haptic feedback
            if ('vibrate' in navigator) {
                navigator.vibrate([200, 100, 200]);
            }
            
            updateDisplay();
            updateScoreboard();
            
            // Auto reset after 2 seconds on mobile, 1.5 on desktop
            const resetDelay = window.innerWidth <= 640 ? 2000 : 1500;
            setTimeout(() => {
                resetRoundToIdle(true);
            }, resetDelay);
        }

        function updateScoreboard() {
            if (hasScored) return;
            hasScored = true;
            
            const current = { ...scores };
            const entry = { ...(current[difficulty] || {}) };
            
            const betterMoves = entry.bestMoves == null || moves < entry.bestMoves ? moves : entry.bestMoves;
            const betterTime = entry.bestTimeMs == null || elapsedMs < entry.bestTimeMs ? elapsedMs : entry.bestTimeMs;
            
            current[difficulty] = {
                bestMoves: betterMoves,
                bestTimeMs: betterTime,
            };
            
            scores = current;
            saveScores(scores);
            updateDisplay();
        }

        function renderGrid() {
            const gridConfig = computeOptimalGrid(deck.length);
            
            // Set up the grid with calculated dimensions
            gameGrid.style.gridTemplateColumns = `repeat(${gridConfig.columns}, 1fr)`;
            gameGrid.style.gridTemplateRows = `repeat(${gridConfig.rows}, 1fr)`;
            
            // Apply consistent sizing for all difficulties
            if (gridConfig.cardSize) {
                const gap = window.innerWidth >= 1024 ? 8 : 6;
                gameGrid.style.maxWidth = `${gridConfig.columns * gridConfig.cardSize + (gridConfig.columns - 1) * gap}px`;
                gameGrid.style.maxHeight = `${gridConfig.rows * gridConfig.cardSize + (gridConfig.rows - 1) * gap}px`;
                gameGrid.style.margin = '0 auto';
            } else {
                // Fallback for cases without cardSize
                gameGrid.style.maxWidth = '600px';
                gameGrid.style.maxHeight = '500px';
                gameGrid.style.margin = '0 auto';
            }
            
            gameGrid.innerHTML = '';
            
            deck.forEach(card => {
                const button = document.createElement('button');
                button.type = 'button';
                
                // Handle empty slots for fixed grids
                if (card.isEmpty) {
                    button.className = 'invisible'; // Invisible placeholder
                    button.disabled = true;
                    gameGrid.appendChild(button);
                    return;
                }
                
                button.className = 'card-button relative aspect-square rounded-lg border-2 text-sm sm:text-base font-bold transition-all duration-200 disabled:opacity-80 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1';
                
                const flipped = revealAll || selectedIds.includes(card.id) || card.matched;
                
                if (card.matched) {
                    button.className += ' bg-emerald-100 border-emerald-300 text-emerald-800';
                } else if (flipped) {
                    button.className += ' bg-blue-50 border-blue-200 text-blue-800';
                } else {
                    button.className += ' bg-slate-100 hover:bg-slate-200 border-slate-300 text-slate-400';
                }
                
                button.disabled = gameState !== "running" || revealAll;
                
                // Use both click and touchstart for better responsiveness
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleCardClick(card.id);
                });
                
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                }, { passive: false });
                
                // Card content
                const emojiSpan = document.createElement('span');
                emojiSpan.className = `select-none transition-opacity duration-200 ${flipped ? 'opacity-100' : 'opacity-0'}`;
                emojiSpan.textContent = card.emoji;
                button.appendChild(emojiSpan);
                
                if (!flipped) {
                    const questionSpan = document.createElement('span');
                    questionSpan.className = 'absolute inset-0 grid place-items-center text-slate-400 text-xs sm:text-sm font-bold';
                    questionSpan.textContent = '?';
                    questionSpan.setAttribute('aria-hidden', 'true');
                    button.appendChild(questionSpan);
                }
                
                gameGrid.appendChild(button);
            });
        }

        function updateDisplay() {
            movesCount.textContent = moves;
            matchedPairsEl.textContent = matchedPairs;
            targetPairsEl.textContent = DIFFICULTY_CONFIG[difficulty].pairs;
            elapsedTimeEl.textContent = formatMs(elapsedMs);
            difficultyLabel.textContent = DIFFICULTY_CONFIG[difficulty].label;
            
            // Update game status
            switch (gameState) {
                case 'idle':
                    gameStatusEl.textContent = '(Tap Start to begin)';
                    statusMessage.textContent = 'Ready when you are — tap Start to begin.';
                    statusMessage.classList.remove('hidden');
                    break;
                case 'preview':
                    gameStatusEl.textContent = '(Previewing cards…)';
                    statusMessage.textContent = `Memorize the cards! They will hide after ${Math.ceil(PREVIEW_MS / 1000)} seconds.`;
                    statusMessage.classList.remove('hidden');
                    break;
                case 'running':
                    gameStatusEl.textContent = '';
                    statusMessage.classList.add('hidden');
                    break;
                case 'paused':
                    gameStatusEl.textContent = '(Paused)';
                    statusMessage.textContent = 'Game paused. Tap Resume to continue.';
                    statusMessage.classList.remove('hidden');
                    break;
                case 'finished':
                    gameStatusEl.textContent = '';
                    statusMessage.innerHTML = `<span class="text-emerald-700 font-medium">🎉 Excellent memory! All pairs found in ${moves} moves • ${formatMs(elapsedMs)}</span>`;
                    statusMessage.classList.remove('hidden');
                    break;
            }
            
            // Update button states
            startBtn.disabled = gameState !== 'idle';
            startBtn.textContent = gameState === 'idle' ? 'Start Game' : 'Starting...';
            
            pauseResumeBtn.disabled = gameState !== 'running' && gameState !== 'paused';
            pauseResumeBtn.textContent = gameState === 'paused' ? 'Resume' : 'Pause';
            
            stopBtn.disabled = gameState === 'idle';
            difficultySelect.disabled = gameState === 'running' || gameState === 'preview';
            
            // Update scoreboard
            const bestForDiff = scores[difficulty] || {};
            bestMovesEl.textContent = bestForDiff.bestMoves != null ? bestForDiff.bestMoves : '—';
            bestTimeEl.textContent = bestForDiff.bestTimeMs != null ? formatMs(bestForDiff.bestTimeMs) : '—';
        }

        // Event handlers
        startBtn.onclick = () => {
            if (gameState !== 'idle') return;
            
            // Reset for new game
            deck = deck.map(c => ({ ...c, matched: false }));
            selectedIds = [];
            moves = 0;
            matchedPairs = 0;
            hasScored = false;
            elapsedMs = 0;
            
            revealAll = true;
            gameState = 'preview';
            updateDisplay();
            renderGrid();
            
            previewTimeout = setTimeout(() => {
                revealAll = false;
                gameState = 'running';
                startTimer();
                updateDisplay();
                renderGrid();
                previewTimeout = null;
            }, PREVIEW_MS);
        };

        pauseResumeBtn.onclick = () => {
            if (gameState === 'running') {
                stopTimer();
                gameState = 'paused';
            } else if (gameState === 'paused') {
                gameState = 'running';
                startTimer();
            }
            updateDisplay();
        };

        stopBtn.onclick = () => {
            resetRoundToIdle(true);
        };

        resetBtn.onclick = () => {
            resetRoundToIdle(false);
        };

        difficultySelect.onchange = (e) => {
            difficulty = e.target.value;
            const config = DIFFICULTY_CONFIG[difficulty];
            const totalSlots = config.columns && config.rows ? config.columns * config.rows : null;
            deck = buildDeck(config.pairs, totalSlots);
            resetRoundToIdle(true);
        };

        resetScoresBtn.onclick = () => {
            if (confirm('Reset all high scores? This cannot be undone.')) {
                scores = { easy: {}, medium: {}, hard: {} };
                saveScores(scores);
                updateDisplay();
            }
        };

        // Handle orientation changes and window resizing
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (gameState !== 'idle') {
                    renderGrid();
                }
            }, 150);
        }
        
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 100); // Small delay for orientation change
        });

        // Prevent zoom on double tap for iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Initialize game
        function init() {
            scores = loadScores();
            const config = DIFFICULTY_CONFIG[difficulty];
            const totalSlots = config.columns && config.rows ? config.columns * config.rows : null;
            deck = buildDeck(config.pairs, totalSlots);
            updateDisplay();
            renderGrid();
        }

        // Start the game
        init();
    </script>
</body>
</html>
